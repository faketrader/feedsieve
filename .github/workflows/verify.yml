name: verify

on:
  workflow_dispatch:
    inputs:
      integrate_upstream:
        description: Verify main merged into firefox
        type: boolean
        default: false
  pull_request:
    branches: [firefox]
  push:
    branches: [firefox]

# 最小权限：本工作流只读仓库，不需要任何写权限。
permissions:
  contents: read

# 只做仓库级验证门禁：lint / typecheck / 测试 / 构建 / 产物与依赖检查。
# 发布打包（pack-store.sh）与签名私钥都在开发机，不进 CI。
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream for scheduled integration verification
        if: inputs.integrate_upstream == true
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "Firefox: $(git rev-parse HEAD); upstream: $(git rev-parse origin/main)" >> "$GITHUB_STEP_SUMMARY"
          git merge --no-edit origin/main

      - uses: pnpm/action-setup@v4
        # 省略 version：action 默认读 package.json 的 packageManager 字段，避免两处漂移。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Keyword pack artifacts (strip-signature compare + built-in key verify)
        run: pnpm keyword-packs:check

      - name: Build community API and generate route types
        run: pnpm --filter @feedsieve/community-api build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Community API tests (workerd)
        run: pnpm --filter @feedsieve/community-api test

      - name: Build extension (wxt)
        run: pnpm build:extension

      - name: Dependency audit
        run: pnpm audit --audit-level high
